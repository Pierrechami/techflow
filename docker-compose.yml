services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n_techflow
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=${N8N_HOST}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://${N8N_HOST}:5678/
      - GENERIC_TIMEZONE=Europe/Paris
      - TZ=Europe/Paris

      # ── Désactivation de l'authentification ──────────────────────────────
      # N8N_BASIC_AUTH_ACTIVE=false désactive le basic auth (déjà fait)
      - N8N_BASIC_AUTH_ACTIVE=false
      # Ces deux variables désactivent le système de login owner/membres
      # introduit en v1.0+ qui causait la redirection vers /signin
      - N8N_USER_MANAGEMENT_DISABLED=true
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_VERSION_NOTIFICATIONS_ENABLED=false
      - N8N_ONBOARDING_FLOW_DISABLED=true

      # ── Base de données (inchangé) ────────────────────────────────────────
      - DB_TYPE=sqlite
      - DB_SQLITE_VACUUM_ON_STARTUP=true

      # ── Historique des exécutions (inchangé) ─────────────────────────────
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=all

    volumes:
      - n8n_data:/home/node/.n8n        # ← volume intact, rien n'est perdu

volumes:
  n8n_data:
    driver: local